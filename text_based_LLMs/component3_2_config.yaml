model_name: "/workspace/models/medalpaca"

lora_r: 128
lora_dropout: 0.1
lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
use_4bit: false

num_train_epochs: 6
per_device_train_batch_size: 2
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 0.00005
lr_scheduler_type: "cosine"


